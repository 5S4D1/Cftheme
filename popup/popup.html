<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cftheme</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <img src="../icons/cf.jpg" alt="icon" class="logo">
        <h2>cftheme</h2>
    </div>

    <div class="main">
        <p class="section-title">Themes</p>
        <hr>
        <div class="container">
            <!-- light theme by default -->
            <button class="theme-btn" data-theme="light">☀️ Light (Default)</button>
            <!-- dark theme -->
            <button class="theme-btn" data-theme="dark">🌙 Dark</button>
            <!-- focus theme only question are visiable another element are blury. -->
            <button class="theme-btn" data-theme="focus">📖 Focus</button>
            <!-- it's a eye-protective theme -->
            <button class="theme-btn" data-theme="shield">🛡️ Shield</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
